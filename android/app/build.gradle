buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.ivy:ivy:2.5.1'
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 31
    namespace 'com.github.aui'

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
            }
        }
     }

    defaultConfig {
        applicationId "com.github.aui.examples"
        minSdk 24
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cmake {
                    // append CMake args if needed , "-DAUIB_AUI_AS=TRUE", "-DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo"
                    arguments "-DAUI_GRADLE_BUILD_DIR=${project.layout.buildDirectory.get()}"
                }
            }
        }
    }
    ndkVersion '25.2.9519653'

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path file('src/main/CMakeLists.txt')
            version '3.16.0+'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
//    implementation project(':aui-bridge')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
}
